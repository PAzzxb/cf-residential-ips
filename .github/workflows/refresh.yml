name: 自动刷新住宅候选池
on:
  schedule:
    - cron: '17 */4 * * *'   # 每 4 小时（UTC 17 分，避开整点拥堵）
  workflow_dispatch: {}       # 支持手动触发

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉上游候选池并重排 + 生成优选池
        run: python3 refresh.py

      - name: 有变化才提交
        run: |
          git config user.name  "pool-bot"
          git config user.email "pool-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "无变化，跳过提交"
          else
            git add -A
            git commit -m "chore: 候选池+优选池自动刷新 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
